apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: aa-session-shape
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
    - apiGroups:
      - apps
      apiVersions:
      - '*'
      operations:
      - CREATE
      - UPDATE
      resources:
      - statefulsets
  validations:
  - expression: has(variables.ps.volumes) && variables.ps.volumes.all(v, (v.name != 'base' || (has(v.configMap)
      && has(v.configMap.name) && v.configMap.name == variables.tool + '-policy')) && (v.name != 'mcp' || (has(v.configMap)
      && has(v.configMap.name) && v.configMap.name == variables.tool + '-mcp')) && (v.name != 'context' ||
      (has(v.configMap) && has(v.configMap.name) && v.configMap.name == 'context-policy')) && (v.name != 'policy'
      || has(v.emptyDir))) && variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
      (m.name != 'base' || m.mountPath == '/policy/base') && (m.name != 'mcp' || m.mountPath == '/policy/mcp')
      && (m.name != 'context' || m.mountPath == '/etc/aa-context')))
    message: Managed base, MCP fragments and context volumes cannot alias each other's trust paths.
  - expression: variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, m.name != 'git-credential'
      || (c.name == variables.tool && m.mountPath == '/var/run/agent-array/git-credential' && has(m.readOnly)
      && m.readOnly && !has(m.subPath) && !has(m.subPathExpr))))
    message: The optional registry-named forge credential is mounted only into the seat CLI read-only.
  - expression: has(variables.ps.priorityClassName) && variables.ps.priorityClassName == 'aa-session' && variables.allContainers.all(c,
      has(c.securityContext) && (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser == 1000)
      && (!has(c.securityContext.runAsGroup) || c.securityContext.runAsGroup == 1000) && (!has(c.securityContext.runAsNonRoot)
      || c.securityContext.runAsNonRoot))
    message: Container identities cannot override the non-root session uid, gid or priority.
  - expression: has(variables.pm.labels) && has(namespaceObject.metadata.labels) && '{{LABEL_PREFIX}}/user'
      in variables.pm.labels && '{{LABEL_PREFIX}}/user' in namespaceObject.metadata.labels && variables.pm.labels['{{LABEL_PREFIX}}/user']
      == namespaceObject.metadata.labels['{{LABEL_PREFIX}}/user'] && variables.tool in ['claude', 'codex',
      'kimi']
    message: Pod user and tool labels must match the user namespace.
  - expression: request.kind.kind != 'Pod' || (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size()
      == 1 && object.metadata.ownerReferences.all(o, o.kind == 'StatefulSet' && o.name.matches('^(claude|codex|kimi)-[a-z0-9-]+$')
      && has(o.controller) && o.controller))
    message: Session pods must be owned by an approved StatefulSet; naked and debug pods are refused.
  - expression: request.kind.kind != 'StatefulSet' || (object.metadata.name.matches('^(claude|codex|kimi)-[a-z0-9-]+$')
      && object.metadata.name.startsWith(variables.tool + '-') && !has(object.spec.volumeClaimTemplates))
    message: StatefulSet names identify the tool and home node; login claims are pre-bound, never dynamically
      cloned.
  - expression: has(variables.ps.runtimeClassName) && variables.ps.runtimeClassName == '{{RUNTIME_CLASS_VM}}'
    message: Session pods require the configured microVM runtime.
  - expression: has(variables.ps.automountServiceAccountToken) && !variables.ps.automountServiceAccountToken
      && has(variables.ps.serviceAccountName) && variables.ps.serviceAccountName == 'session'
    message: Only the session ServiceAccount is allowed; automatic API tokens are disabled.
  - expression: '!has(variables.ps.nodeName) && has(variables.ps.nodeSelector) && ''kubernetes.io/hostname''
      in variables.ps.nodeSelector && ''{{LABEL_PREFIX}}/role-sessions'' in variables.ps.nodeSelector && variables.ps.nodeSelector[''{{LABEL_PREFIX}}/role-sessions'']
      == ''true'''
    message: Scheduler placement must pin the declared home node with the sessions role.
  - expression: (!has(variables.ps.hostNetwork) || !variables.ps.hostNetwork) && (!has(variables.ps.hostPID)
      || !variables.ps.hostPID) && (!has(variables.ps.hostIPC) || !variables.ps.hostIPC) && (!has(variables.ps.shareProcessNamespace)
      || !variables.ps.shareProcessNamespace) && (!has(variables.ps.ephemeralContainers) || variables.ps.ephemeralContainers.size()
      == 0)
    message: Host namespaces, process sharing and ephemeral containers are forbidden.
  - expression: has(variables.ps.securityContext) && has(variables.ps.securityContext.runAsNonRoot) && variables.ps.securityContext.runAsNonRoot
      && has(variables.ps.securityContext.runAsUser) && variables.ps.securityContext.runAsUser == 1000 && has(variables.ps.securityContext.seccompProfile)
      && has(variables.ps.securityContext.seccompProfile.type) && variables.ps.securityContext.seccompProfile.type
      == 'RuntimeDefault' && has(variables.ps.securityContext.runAsGroup) && variables.ps.securityContext.runAsGroup
      == 1000
    message: The pod runs as uid 1000 with RuntimeDefault seccomp.
  - expression: 'variables.allContainers.all(c, c.image == (c.name == ''supervisor'' ? ''{{C_SUPERVISOR_IMAGE}}''
      : variables.tool == ''claude'' ? ''{{IMAGE_SESSION_CLAUDE}}'' : variables.tool == ''codex'' ? ''{{IMAGE_SESSION_CODEX}}''
      : ''{{IMAGE_SESSION_KIMI}}'') && c.image.matches(''.*@sha256:[0-9a-f]{64}$''))'
    message: Every container image must be an approved digest-pinned session image.
  - expression: variables.allContainers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged)
      || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation
      && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem && has(c.securityContext.capabilities)
      && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add)
      || c.securityContext.capabilities.add.size() == 0) && (!has(c.securityContext.seccompProfile) || (has(c.securityContext.seccompProfile.type)
      && c.securityContext.seccompProfile.type == 'RuntimeDefault')))
    message: Containers require a read-only root, no privilege escalation, no privileges or added capabilities.
  - expression: variables.allContainers.all(c, !has(c.envFrom) && !has(c.lifecycle) && (!has(c.ports) || c.ports.all(p,
      !has(p.hostPort))) && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))))
    message: Environment sources, secrets, lifecycle hooks and host ports are forbidden.
  - expression: variables.allContainers.all(c, !has(c.env) || c.env.all(e, !(e.name in ['ANTHROPIC_API_KEY',
      'ANTHROPIC_AUTH_TOKEN', 'ANTHROPIC_BASE_URL', 'CLAUDE_CODE_OAUTH_TOKEN', 'OPENAI_API_KEY', 'OPENAI_BASE_URL',
      'CODEX_API_KEY', 'CODEX_BASE_URL', 'CODEX_AUTH_TOKEN', 'KIMI_API_KEY', 'KIMI_BASE_URL', 'MOONSHOT_API_KEY',
      'MOONSHOT_BASE_URL', 'NODE_OPTIONS', 'NODE_EXTRA_CA_CERTS', 'SSL_CERT_FILE', 'SSL_CERT_DIR', 'REQUESTS_CA_BUNDLE',
      'CURL_CA_BUNDLE', 'BASH_ENV', 'ENV', 'SHELLOPTS', 'PS4', 'PATH', 'LD_PRELOAD', 'LD_LIBRARY_PATH', 'DISABLE_TELEMETRY',
      'DO_NOT_TRACK', 'CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC', 'DISABLE_GROWTHBOOK']) && !e.name.startsWith('PYTHON')
      && !e.name.startsWith('BASH_FUNC_') && (!e.name.startsWith('ANTHROPIC_')) && (!e.name.startsWith('OPENAI_'))
      && (!e.name.startsWith('CLAUDE_') || e.name == 'CLAUDE_CONFIG_DIR') && (!e.name.startsWith('CODEX_')
      || e.name == 'CODEX_HOME') && (!e.name.startsWith('KIMI_') || e.name in ['KIMI_CODE_HOME', 'KIMI_DISABLE_CRON',
      'KIMI_DISABLE_TELEMETRY'])))
    message: Vendor credentials, endpoint overrides, OAuth tokens, preload code and alternate trust stores
      are refused.
  - expression: variables.allContainers.all(c, !has(c.env) || c.env.all(e, e.name != 'AA_LOGIN_STORAGE' ||
      (has(e.value) && e.value == '{{LOGIN_STORAGE}}')))
    message: AA_LOGIN_STORAGE must agree with the organization disk or tmpfs decision.
  - expression: variables.allContainers.all(c, !has(c.env) || c.env.all(e, !(e.name in ['HTTP_PROXY', 'HTTPS_PROXY',
      'http_proxy', 'https_proxy', 'ALL_PROXY', 'all_proxy']) || (variables.tool == 'kimi' && e.name in ['HTTP_PROXY',
      'HTTPS_PROXY'] && has(e.value) && e.value == 'http://kimi-egress.{{NS_EGRESS}}.svc:3128')))
    message: Only Kimi may use the managed exact-host egress proxy.
  - expression: 'has(variables.ps.volumes) && variables.ps.volumes.all(v, (has(v.emptyDir) && has(v.emptyDir.medium)
      && v.emptyDir.medium == ''Memory'' && has(v.emptyDir.sizeLimit)) || (has(v.configMap) && has(v.configMap.name)
      && v.configMap.name in [variables.tool + ''-policy'', variables.tool + ''-mcp'', ''context-policy'',
      ''supervisor-policy'']) || (has(v.secret) && v.name == ''git-credential'' && has(v.secret.secretName)
      && has(namespaceObject.metadata.annotations) && ''{{LABEL_PREFIX}}/git-secret'' in namespaceObject.metadata.annotations
      && v.secret.secretName == namespaceObject.metadata.annotations[''{{LABEL_PREFIX}}/git-secret''] && v.secret.secretName
      != '''') || (has(v.persistentVolumeClaim) && v.name == ''login'') || (has(v.projected) && v.name in [''mcp-token'',
      ''pace-token'', ''supervisor-token'', ''supervisor-hook-token''] && has(v.projected.sources) && v.projected.sources.size()
      == 1 && v.projected.sources.all(s, has(s.serviceAccountToken) && has(s.serviceAccountToken.audience)
      && s.serviceAccountToken.audience == (v.name == ''mcp-token'' ? ''{{PROJECT_NAME}}-mcp'' : v.name ==
      ''pace-token'' ? ''{{PROJECT_NAME}}-pace'' : v.name == ''supervisor-token'' ? ''{{PROJECT_NAME}}-supervisor''
      : ''{{PROJECT_NAME}}-supervisor-hook'') && has(s.serviceAccountToken.expirationSeconds) && s.serviceAccountToken.expirationSeconds
      > 0 && s.serviceAccountToken.expirationSeconds <= 3600 && has(s.serviceAccountToken.path) && s.serviceAccountToken.path
      == ''token'')))'
    message: Only bounded RAM volumes, managed ConfigMaps, registry-named CLI forge credentials, the login
      claim and four short-lived audiences are permitted.
  - expression: has(variables.ps.nodeSelector) && 'kubernetes.io/hostname' in variables.ps.nodeSelector &&
      variables.loginClaims.size() == 1 && variables.loginClaims.all(v, has(v.persistentVolumeClaim) && has(v.persistentVolumeClaim.claimName)
      && v.persistentVolumeClaim.claimName == variables.tool + '-home-' + variables.stsName.substring(variables.tool.size()
      + 1))
    message: The pod mounts only its tool login claim on its declared home node; PVC user ownership is validated
      separately.
  - expression: 'variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, m.name != ''login''
      || (c.name == variables.tool && m.mountPath == ''/home/'' + variables.tool + (variables.tool == ''claude''
      ? ''/.claude'' : variables.tool == ''codex'' ? ''/.codex'' : ''/.kimi-code'') && !has(m.subPath) && !has(m.subPathExpr))
      || (c.name == ''usage'' && variables.tool == ''codex'' && m.mountPath == ''/usage/sessions'' && has(m.subPath)
      && m.subPath == ''sessions'' && !has(m.subPathExpr) && has(m.readOnly) && m.readOnly) || (c.name == ''supervisor''
      && variables.tool in [''claude'',''codex''] && m.mountPath == ''/transcripts/'' + variables.tool && has(m.subPath)
      && m.subPath == (variables.tool == ''claude'' ? ''projects'' : ''sessions'') && !has(m.subPathExpr) &&
      has(m.readOnly) && m.readOnly)))'
    message: Only CLI mounts whole login; usage and supervisor mount exact read-only transcript subPaths.
  - expression: variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, (m.name != 'mcp-token'
      || (c.name == variables.tool && m.mountPath == '/var/run/agent-array/mcp-token' && has(m.readOnly) &&
      m.readOnly)) && (m.name != 'pace-token' || (c.name in [variables.tool,'usage','supervisor'] && m.mountPath
      == '/var/run/agent-array/pace-token' && has(m.readOnly) && m.readOnly))))
    message: MCP tokens are CLI-only; pace tokens are CLI, usage and supervisor only.
  - expression: variables.ps.containers.all(c, c.name in [variables.tool,'estate', 'usage', 'supervisor'] &&
      (c.name != 'usage' || variables.tool == 'codex')) && (!has(variables.ps.initContainers) || variables.ps.initContainers.all(c,
      c.name == 'policy-merge'))
    message: Only the official seat CLI, estate receiver, Codex usage and managed policy init containers are
      allowed.
  - expression: '!has(variables.ps.imagePullSecrets) || variables.ps.imagePullSecrets.all(s, s.name == ''{{REGISTRY_PULL_SECRET}}'')'
    message: Only the registry pull Secret may be referenced.
  - expression: request.kind.kind != 'Pod' || request.operation != 'UPDATE' || object.spec.containers.map(c,c.image)
      == oldObject.spec.containers.map(c,c.image)
    message: Pod images cannot change beside a live login; roll out the StatefulSet instead.
  - expression: 'variables.ps.containers.all(c, (c.name == variables.tool && !has(c.command) && has(c.args)
      && c.args == [variables.tool]) || (c.name == ''estate'' && has(c.command) && c.command == [''/usr/local/bin/aa-snapshot'',
      ''serve''] && !has(c.args)) || (c.name == ''usage'' && has(c.command) && c.command.size() == 3 && c.command[0]
      == ''/usr/local/bin/aa-usage-report'' && c.command[1] == ''--loop'' && !has(c.args)) || (c.name == ''supervisor''
      && !has(c.command) && !has(c.args))) && (!has(variables.ps.initContainers) || variables.ps.initContainers.all(c,
      has(c.command) && c.command == [''/usr/local/bin/aa-policy-merge'', ''--tool'',variables.tool,''--base'',
      ''/policy/base'', ''--mcp'', ''/policy/mcp'', ''--out'',variables.tool == ''claude'' ? ''/etc/claude-code''
      : ''/etc/'' + variables.tool] && !has(c.args)))'
    message: The vendor image entrypoint is mandatory; only managed helpers may override commands.
  - expression: variables.ps.containers.exists(c, c.name == variables.tool && has(c.env) && c.env.exists(e,
      e.name == 'AA_LOGIN_STORAGE' && has(e.value) && e.value == '{{LOGIN_STORAGE}}'))
    message: The seat CLI must declare the organization login storage mode disk or tmpfs.
  - expression: variables.allContainers.all(c, !has(c.env) || c.env.all(e, !(e.name in ['KIMI_DISABLE_CRON',
      'KIMI_DISABLE_TELEMETRY']) || (has(e.value) && e.value == '1')))
    message: Kimi scheduling and telemetry cannot be re-enabled.
  - expression: variables.allContainers.all(c, has(c.volumeMounts) && c.volumeMounts.all(m, (c.name == 'policy-merge'
      && m.name in ['base','mcp','policy'] && (m.name == 'policy' || (has(m.readOnly) && m.readOnly))) || (c.name
      == 'estate' && m.name in ['snap','estate-tmp','context'] && (m.name != 'context' || (has(m.readOnly)
      && m.readOnly))) || (c.name == 'usage' && m.name in ['login','pace-token'] && has(m.readOnly) && m.readOnly)
      || (c.name == variables.tool && m.name in ['home','login','tmp','work','snap','policy','mcp-token','pace-token','git-credential','aa-tmux','aa-shared']
      && (!(m.name in ['snap','policy','mcp-token','pace-token','git-credential']) || (has(m.readOnly) && m.readOnly)))
      || (c.name == 'supervisor' && m.name in ['aa-tmux','aa-shared','supervisor-run','supervisor-tmp','supervisor-policy','supervisor-token','supervisor-hook-token','pace-token','login']
      && (!(m.name in ['supervisor-policy','supervisor-token','supervisor-hook-token','pace-token','login'])
      || (has(m.readOnly) && m.readOnly)))))
    message: Each managed container mounts only its owned storage; estate and init cannot read logins or tokens,
      and CLI cannot modify policy or snapshots.
  - expression: 'variables.ps.containers.all(c, c.name != variables.tool || (has(c.volumeMounts) && c.volumeMounts.exists(m,
      m.name == ''policy'' && m.mountPath == (variables.tool == ''claude'' ? ''/etc/claude-code'' : ''/etc/''
      + variables.tool) && has(m.readOnly) && m.readOnly && !has(m.subPath) && !has(m.subPathExpr))))'
    message: The CLI must mount the complete merged managed policy read-only at its official path.
  - expression: 'variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, !has(m.subPathExpr)
      && (m.name != ''policy'' || (m.mountPath == (variables.tool == ''claude'' ? ''/etc/claude-code'' : ''/etc/''
      + variables.tool) && !has(m.subPath)))))'
    message: Policy aliases and interpolated subPaths are forbidden.
  - expression: 'variables.ps.containers.filter(c,c.name == variables.tool).size() == 1 && variables.ps.containers.filter(c,c.name
      == ''estate'').size() == 1 && variables.ps.containers.filter(c,c.name == ''usage'').size() == (variables.tool
      == ''codex'' ? 1 : 0) && has(variables.ps.initContainers) && variables.ps.initContainers.size() == 1'
    message: Session templates require one seat CLI, one estate receiver, one policy init, and only Codex has
      the usage reporter.
  - expression: variables.allContainers.all(c, !has(c.env) || c.env.all(e, e.name != 'ENABLE_CLAUDEAI_MCP_SERVERS'
      || (has(e.value) && e.value == 'false')))
    message: Managed Claude connectors cannot be enabled through an environment override.
  - expression: 'variables.ps.containers.filter(c,c.name == ''supervisor'').size() == ({{C_SUPERVISOR_ENABLED}}
      ? 1 : 0)'
    message: Supervisor enablement selects exactly one approved sidecar or none.
  - expression: 'variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, !(m.name in [''supervisor-run'',''supervisor-tmp'',''supervisor-policy'',''supervisor-token'',''supervisor-hook-token''])
      || (c.name == ''supervisor'' && !has(m.subPath) && !has(m.subPathExpr) && m.mountPath == (m.name == ''supervisor-run''
      ? ''/run/aa-supervisor'' : m.name == ''supervisor-tmp'' ? ''/tmp'' : m.name == ''supervisor-policy''
      ? ''/etc/aa-supervisor'' : ''/var/run/agent-array/'' + m.name))))'
    message: Private control storage and supervisor tokens are sidecar-only at exact paths.
  - expression: 'has(variables.ps.volumes) && variables.ps.volumes.all(v, v.name != ''supervisor-policy'' ||
      (has(v.configMap) && has(v.configMap.name) && v.configMap.name == ''supervisor-policy'')) && variables.ps.volumes.all(v,
      !(v.name in [''aa-tmux'',''aa-shared'',''supervisor-run'',''supervisor-tmp'']) || (has(v.emptyDir) &&
      has(v.emptyDir.medium) && v.emptyDir.medium == ''Memory'' && has(v.emptyDir.sizeLimit) && v.emptyDir.sizeLimit
      == (v.name == ''aa-tmux'' ? ''8Mi'' : v.name == ''supervisor-tmp'' ? ''64Mi'' : ''16Mi'')))'
    message: Supervision volumes cannot alias credentials or durable storage.
  - expression: 'variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m, !(m.name in [''aa-tmux'',''aa-shared''])
      || (c.name in [variables.tool,''supervisor''] && m.mountPath == (m.name == ''aa-tmux'' ? ''/run/aa-tmux''
      : ''/run/aa'') && (!has(m.readOnly) || !m.readOnly) && !has(m.subPath) && !has(m.subPathExpr))))'
    message: Only CLI and supervisor share complete writable tmux and request volumes.
  - expression: variables.ps.containers.all(c, c.name != 'supervisor' || (has(c.securityContext) && has(c.securityContext.runAsUser)
      && c.securityContext.runAsUser == 1000 && has(c.securityContext.runAsGroup) && c.securityContext.runAsGroup
      == 1000 && !has(c.ports)))
    message: Supervisor has the CLI uid/gid and no network listeners.
  - expression: 'variables.allContainers.all(c, !has(c.env) || c.env.all(e, !(e.name in [''AA_SUPERVISOR'',''TMUX_TMPDIR'',''TINI_SUBREAPER''])
      || (c.name == variables.tool && {{C_SUPERVISOR_ENABLED}} && has(e.value) && e.value == (e.name == ''TMUX_TMPDIR''
      ? ''/run/aa-tmux'' : ''1''))))'
    message: Supervision CLI overrides are exact and require enablement.
  - expression: has(variables.ps.volumes) && variables.ps.volumes.all(v, !(v.name in ['mcp-token','pace-token','supervisor-token','supervisor-hook-token'])
      || has(v.projected))
    message: Token volume names always identify projected tokens, never aliases.
  - expression: 'variables.ps.containers.all(c, c.name != ''supervisor'' || (has(c.volumeMounts) && c.volumeMounts.size()
      == (variables.tool == ''kimi'' ? 8 : 9) && [''aa-tmux'',''aa-shared'',''supervisor-run'',''supervisor-tmp'',''supervisor-policy'',''supervisor-token'',''supervisor-hook-token'',''pace-token''].all(n,
      c.volumeMounts.exists(m, m.name == n)) && (variables.tool == ''kimi'' || c.volumeMounts.exists(m,m.name
      == ''login''))))'
    message: Supervisor requires its complete private control, policy, projected tokens and transcript shape.
  - expression: variables.ps.containers.size() > 0 && variables.ps.containers[0].name == variables.tool
    message: The CLI is the default container; omitted-container exec never selects private supervisor control.
  variables:
  - name: ps
    expression: 'request.kind.kind == ''Pod'' ? object.spec : (has(object.spec.template) && has(object.spec.template.spec)
      ? object.spec.template.spec : {})'
  - name: pm
    expression: 'request.kind.kind == ''Pod'' ? object.metadata : (has(object.spec.template) && has(object.spec.template.metadata)
      ? object.spec.template.metadata : {})'
  - name: allContainers
    expression: 'variables.ps.containers + (has(variables.ps.initContainers) ? variables.ps.initContainers
      : [])'
  - name: tool
    expression: 'has(variables.pm.labels) && ''{{LABEL_PREFIX}}/tool'' in variables.pm.labels ? variables.pm.labels[''{{LABEL_PREFIX}}/tool'']
      : '''''
  - name: loginClaims
    expression: 'has(variables.ps.volumes) ? variables.ps.volumes.filter(v, has(v.persistentVolumeClaim)) :
      []'
  - name: stsName
    expression: 'request.kind.kind == ''StatefulSet'' ? object.metadata.name : (has(object.metadata.ownerReferences)
      && object.metadata.ownerReferences.size() == 1 ? object.metadata.ownerReferences[0].name : '''')'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: aa-session-shape
spec:
  policyName: aa-session-shape
  validationActions:
  - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        '{{LABEL_PREFIX}}/kind': user-sessions
