apiVersion: v1
kind: ResourceQuota
metadata:
  name: session
  labels:
    app.kubernetes.io/name: session
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: sessions
  namespace: '{{USER_NS}}'
spec:
  hard:
    pods: '{{TIER_PODS}}'
    count/statefulsets.apps: '{{TIER_STATEFULSETS}}'
    persistentvolumeclaims: '{{TIER_PVCS}}'
    requests.cpu: '{{TIER_REQUESTS_CPU}}'
    requests.memory: '{{TIER_REQUESTS_MEMORY}}'
    limits.cpu: '{{TIER_LIMITS_CPU}}'
    limits.memory: '{{TIER_LIMITS_MEMORY}}'
    count/jobs.batch: '0'
    count/cronjobs.batch: '0'
    count/deployments.apps: '0'
    count/daemonsets.apps: '0'
    count/replicasets.apps: '0'
    count/services: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: session
  labels:
    app.kubernetes.io/name: session
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: sessions
  namespace: '{{USER_NS}}'
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: '2'
      memory: 4Gi
