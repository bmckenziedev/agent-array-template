version: 1
secrets:
  - name: registry-pull
    required_when: always
    namespace_ref: user
    keys: [.dockerconfigjson]
    purpose: Pull digest-pinned session images from the configured registry
    recipe: "Provision the registry pull Secret named by org.registry.pull_secret in each user namespace"
  - name: session-admission-tls
    required_when: always
    namespace_ref: system
    keys: [tls.crt, tls.key]
    purpose: TLS identity for the fail-closed session admission lookup webhook
    recipe: "Provision a serving certificate for the session admission Service DNS name and set components.sessions.admission_ca_bundle to its trusted CA"
