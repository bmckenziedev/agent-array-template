# tmux for aa-codex. Window 0 "codex" shows the login state and is where you
# start a session (`aa-codex`); window 1 "shell" is for
# `codex login --device-auth` and ad-hoc work.
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 0
set -g escape-time 10
set -g status-left "[aa-codex] "
set -g status-right "#{session_name} | %H:%M UTC"
set -g display-time 3000
