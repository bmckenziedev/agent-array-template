# tmux for aa-claude. Window 0 "rc" runs aa-rc (the Remote Control
# listener); window 1 "shell" is for `claude auth login` and ad-hoc work.
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 0
set -g status-left "[aa] "
set -g status-right "#{session_name} | %H:%M UTC"
set -g display-time 3000
