# tmux for aa-kimi. Window 0 "kimi" runs aa-kimi (the Kimi Code CLI,
# idle until you type); window 1 "shell" is for ad-hoc work.
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 0
set -g status-left "[aa-kimi] "
set -g status-right "#{session_name} | %H:%M UTC"
set -g display-time 3000
