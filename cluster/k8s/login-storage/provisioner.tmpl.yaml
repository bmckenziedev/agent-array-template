apiVersion: v1
kind: ServiceAccount
metadata:
  name: login-local-path
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
  namespace: '{{PROJECT_NAME}}-login-storage'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: login-local-path
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
  namespace: '{{PROJECT_NAME}}-login-storage'
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: login-local-path
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - persistentvolumeclaims
  - configmaps
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: login-local-path
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
  namespace: '{{PROJECT_NAME}}-login-storage'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: login-local-path
subjects:
- kind: ServiceAccount
  name: login-local-path
  namespace: '{{PROJECT_NAME}}-login-storage'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: login-local-path
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: login-local-path
subjects:
- kind: ServiceAccount
  name: login-local-path
  namespace: '{{PROJECT_NAME}}-login-storage'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: login-local-path-scripts
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
  namespace: '{{PROJECT_NAME}}-login-storage'
data:
  setup: '#!/bin/sh

    set -eu

    mkdir -p "$VOL_DIR"

    chmod 0700 "$VOL_DIR"

    chown 1000:1000 "$VOL_DIR"

    '
  teardown: '#!/bin/sh

    set -eu

    echo "Retained login volumes require reviewed offboarding wipe" >&2

    exit 1

    '
  helperPod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: login-storage-helper\n\
    \  labels:\n    app.kubernetes.io/name: login-local-path\nspec:\n  nodeSelector:\n\
    \    '{{LABEL_PREFIX}}/role-sessions': 'true'\n  securityContext:\n    runAsUser:\
    \ 0\n    seccompProfile:\n      type: RuntimeDefault\n  containers:\n  - name:\
    \ helper-pod\n    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662\n\
    \    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem:\
    \ true\n      capabilities:\n        drop:\n        - ALL\n        add:\n    \
    \    - CHOWN\n        - DAC_OVERRIDE\n        - FOWNER\n    resources:\n     \
    \ requests:\n        cpu: 10m\n        memory: 16Mi\n      limits:\n        cpu:\
    \ 100m\n        memory: 64Mi\n  automountServiceAccountToken: false\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-local-path
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
  namespace: '{{PROJECT_NAME}}-login-storage'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: login-local-path
  template:
    metadata:
      labels:
        app.kubernetes.io/name: login-local-path
        app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    spec:
      serviceAccountName: login-local-path
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provisioner
        image: rancher/local-path-provisioner:v0.0.32@sha256:9289da488b07912cb4128eb96928a331a5f3e60c28c5cfc5790f354a4ad0cc68
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        - --provisioner-name
        - '{{LABEL_PREFIX}}/login-local-path'
        - --helper-pod-file
        - /etc/config/helperPod.yaml
        - --configmap-name
        - login-local-path-scripts
        - --service-account-name
        - login-local-path
        - --helper-image
        - busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONFIG_MOUNT_PATH
          value: /etc/config/
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: login-local-path-config
          - configMap:
              name: login-local-path-scripts
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: '{{STORAGE_CLASS_LOGIN}}'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: login-storage
provisioner: '{{LABEL_PREFIX}}/login-local-path'
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowedTopologies:
- matchLabelExpressions:
  - key: '{{LABEL_PREFIX}}/role-sessions'
    values:
    - 'true'
