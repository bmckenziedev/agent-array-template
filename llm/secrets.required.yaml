version: 1
secrets:
  - name: litellm-env
    namespace_ref: llm
    keys: [LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL]
    purpose: Gateway administration and database connection; salt must remain stable
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref llm --name litellm-env --keys LITELLM_MASTER_KEY,LITELLM_SALT_KEY,DATABASE_URL"
    required_when: always
  - name: litellm-pg
    namespace_ref: llm
    keys: [POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB]
    purpose: Postgres credentials matching DATABASE_URL
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref llm --name litellm-pg --keys POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB"
    required_when: always
  - name: litellm-redis
    namespace_ref: llm
    keys: [REDIS_PASSWORD]
    purpose: Redis coordination authentication
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref llm --name litellm-redis --keys REDIS_PASSWORD"
    required_when: always
  - name: litellm-mint
    namespace_ref: portal
    keys: [LITELLM_MINT_KEY]
    purpose: Trusted portal key management
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref portal --name litellm-mint --keys LITELLM_MINT_KEY"
    required_when: always
  - name: litellm-mint
    namespace_ref: system
    keys: [LITELLM_MINT_KEY]
    purpose: Trusted farm service key management
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref system --name litellm-mint --keys LITELLM_MINT_KEY"
    required_when: always
# Every type api account Secret must exist in NS_LLM. plan --check-secrets
# lists these dynamic name/key references; it does not read Kubernetes Secrets.
  - name: litellm-env
    namespace_ref: llm
    keys: [LITELLM_LICENSE]
    purpose: Optional approved enterprise licence
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref llm --name litellm-env --keys LITELLM_LICENSE"
    required_when: org.components.llm.enterprise_license
