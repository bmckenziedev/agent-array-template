    }
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/name": "litellm-pg"
      }
    },
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "litellm"
              }
            }
          }
        ],
        "ports": [
          {
            "port": 5432,
            "protocol": "TCP"
          }
        ]
      }
    ],
    "egress": []
  }
}
