{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "litellm-pg",
    "namespace": "{{NS_LLM}}",
    "labels": {
      "app.kubernetes.io/name": "litellm-pg",
      "app.kubernetes.io/part-of": "{{PROJECT_NAME}}",
      "app.kubernetes.io/component": "llm"
    }
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "litellm-pg"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "litellm-pg",
          "app.kubernetes.io/part-of": "{{PROJECT_NAME}}",
          "app.kubernetes.io/component": "llm"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 70,
          "runAsGroup": 70,
          "fsGroup": 70,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "litellm-pg",
            "image": "postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea",
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "2Gi"
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql/data"
              },
              {
                "name": "run",
                "mountPath": "/var/run/postgresql"
              }
            ],
            "env": [
              {
                "name": "POSTGRES_USER",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "litellm-pg",
                    "key": "POSTGRES_USER"
                  }
                }
              },
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "litellm-pg",
                    "key": "POSTGRES_PASSWORD"
                  }
                }
              },
              {
                "name": "POSTGRES_DB",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "litellm-pg",
                    "key": "POSTGRES_DB"
                  }
                }
              },
              {
                "name": "PGDATA",
                "value": "/var/lib/postgresql/data/pgdata"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-c",
                  "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                ]
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "run",
            "emptyDir": {}
          }
        ]
      }
    },
    "serviceName": "litellm-pg",
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "storageClassName": "{{STORAGE_CLASS_DEFAULT}}",
          "resources": {
            "requests": {
              "storage": "5Gi"
            }
          }
        }
      }
    ]
  }
}
