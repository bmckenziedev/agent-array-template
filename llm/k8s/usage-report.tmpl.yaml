apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-usage
  namespace: "{{NS_LLM}}"
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-usage
  namespace: "{{NS_LLM}}"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-usage
        spec:
          serviceAccountName: litellm-usage
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
          - name: usage
            image: "ghcr.io/berriai/litellm-database:v1.104.0@sha256:fbe28229d2d02181c0a7d9df9599de614b491f3d897d2d7da18404f088310218"
            command: [python, /opt/llm-admin/teams_sync.py]
            args: [--base-url, "http://litellm.{{NS_LLM}}.svc:4000", report-usage, --pace-url, "http://pace.{{NS_SYSTEM}}.svc:8080"]
            env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: litellm-env, key: LITELLM_MASTER_KEY}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
            - {name: admin, mountPath: /opt/llm-admin, readOnly: true}
            - {name: directory, mountPath: /etc/agent-array/org, readOnly: true}
            - {name: pace-token, mountPath: /var/run/agent-array/pace-token, readOnly: true}
          volumes:
          - name: admin
            configMap: {name: litellm-admin}
          - name: directory
            configMap: {name: org-directory}
          - name: pace-token
            projected:
              sources:
              - serviceAccountToken:
                  audience: "{{PROJECT_NAME}}-pace"
                  expirationSeconds: 3600
                  path: token
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-usage
  namespace: "{{NS_LLM}}"
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: litellm-usage}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: "{{NS_SYSTEM}}"}
      podSelector:
        matchLabels: {app.kubernetes.io/name: pace}
    ports: [{protocol: TCP, port: 8080}]
  - to:
    - podSelector:
        matchLabels: {app.kubernetes.io/name: litellm}
    ports: [{protocol: TCP, port: 4000}]
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-usage-ingress
  namespace: "{{NS_LLM}}"
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: litellm}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app.kubernetes.io/name: litellm-usage}
    ports: [{protocol: TCP, port: 4000}]
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: "{{NS_MONITORING}}"}
    ports: [{protocol: TCP, port: 4001}]
