githubConfigUrl: https://github.com/{{ORG_GITHUB_ORG}}
githubConfigSecret: arc-github-app
minRunners: 0
maxRunners: {{M_ARC_CI_MAX_LIGHT}}
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: {{PROJECT_NAME}}-arc-systems
listenerTemplate:
  spec:
    nodeSelector:
      '{{LABEL_PREFIX}}/role-ci': 'true'
    containers:
    - name: listener
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
template:
  spec:
    automountServiceAccountToken: false
    runtimeClassName: '{{RUNTIME_CLASS_GVISOR}}'
    priorityClassName: ci-runner
    containers:
    - name: runner
      image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
      command:
      - /home/runner/run.sh
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
          ephemeral-storage: 20Gi
    serviceAccountName: arc-light-runner
    nodeSelector:
      '{{LABEL_PREFIX}}/role-ci': 'true'
runnerScaleSetName: '{{M_ARC_CI_RUNNER_LIGHT}}'
runnerGroup: Default
