version: 1
secrets:
- name: arc-github-app
  namespace_ref: "{{PROJECT_NAME}}-arc-systems"
  keys:
  - github_app_id
  - github_app_installation_id
  - github_app_private_key
  purpose: GitHub App runner provisioning
  recipe: Provision through the sealed-secrets workflow; never commit values
  required_when: org.modules.arc-ci.enabled
- name: arc-github-app
  namespace_ref: "{{PROJECT_NAME}}-arc-runners"
  keys:
  - github_app_id
  - github_app_installation_id
  - github_app_private_key
  purpose: GitHub App runner provisioning
  recipe: Provision through the sealed-secrets workflow; never commit values
  required_when: org.modules.arc-ci.enabled
- name: arc-github-app
  namespace_ref: "{{PROJECT_NAME}}-arc-heavy"
  keys:
  - github_app_id
  - github_app_installation_id
  - github_app_private_key
  purpose: GitHub App runner provisioning
  recipe: Provision through the sealed-secrets workflow; never commit values
  required_when: org.modules.arc-ci.enabled
