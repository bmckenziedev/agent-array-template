version: 1
secrets:
  - name: model-server-auth
    namespace_ref: models
    keys: [api-key]
    purpose: Shared bearer authentication for local serving lanes
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref models --name model-server-auth --keys api-key"
    required_when: org.modules.gpu-lanes.enabled
  - name: model-server-auth
    namespace_ref: llm
    keys: [api-key]
    purpose: Same bearer value consumed by LiteLLM; seal independently per namespace
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref llm --name model-server-auth --keys api-key"
    required_when: org.modules.gpu-lanes.enabled
