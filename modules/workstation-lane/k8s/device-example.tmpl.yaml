apiVersion: v1
kind: ServiceAccount
metadata:
  name: workstation-device-a
  namespace: "{{NS_FACTORY}}"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workstation-device-a
  namespace: "{{NS_FACTORY}}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workstation-transport
subjects:
  - kind: ServiceAccount
    name: workstation-device-a
    namespace: "{{NS_FACTORY}}"
