apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-ops-chat
  namespace: "{{NS_OPS}}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{PROJECT_NAME}}-ops-chat-read"
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, services, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{PROJECT_NAME}}-ops-chat-read"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{PROJECT_NAME}}-ops-chat-read"
subjects:
  - kind: ServiceAccount
    name: hermes-ops-chat
    namespace: "{{NS_OPS}}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-home
  namespace: "{{NS_OPS}}"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: "{{STORAGE_CLASS_DEFAULT}}"
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-ops-chat
  namespace: "{{NS_OPS}}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-ops-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-ops-chat
        app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
        app.kubernetes.io/component: ops-chat
        "{{LABEL_PREFIX}}/llm-client": "true"
    spec:
      runtimeClassName: "{{RUNTIME_CLASS_VM}}"
      serviceAccountName: hermes-ops-chat
      imagePullSecrets:
        - name: "{{REGISTRY_PULL_SECRET}}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat
          image: "{{IMAGE_HERMES_CHAT}}"
          env:
            - name: ARRAYOPS_READONLY
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: home
              mountPath: /var/lib/hermes
            - name: config
              mountPath: /etc/hermes/config.json
              subPath: config.json
              readOnly: true
            - name: directory
              mountPath: /etc/agent-array/org
              readOnly: true
            - name: llm
              mountPath: /etc/hermes/llm
              readOnly: true
            - name: bot
              mountPath: /etc/hermes/bot
              readOnly: true
            - name: identities
              mountPath: /etc/hermes/identities
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: hermes-home
        - name: config
          configMap:
            name: hermes-ops-chat-config
        - name: directory
          configMap:
            name: org-directory
        - name: llm
          secret:
            secretName: hermes-llm-key
        - name: bot
          secret:
            secretName: "{{M_HERMES_OPS_CHAT_BOT_SECRET}}"
        - name: identities
          secret:
            secretName: "{{M_HERMES_OPS_CHAT_IDENTITY_SECRET}}"
