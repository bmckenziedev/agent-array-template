version: 1
secrets:
- name: hermes-llm-key
  namespace_ref: ops
  keys:
  - api-key
  purpose: Scoped LiteLLM virtual key backed by an org API account
  recipe: Provision through the sealed-secrets workflow; never commit values
  required_when: org.modules.hermes-ops-chat.enabled
- name: hermes-chat-bot
  namespace_ref: ops
  keys:
  - bot-token
  - app-token
  purpose: Platform bot credentials; app-token required for Slack only
  recipe: Provision through the sealed-secrets workflow; never commit values
  required_when: org.modules.hermes-ops-chat.enabled
- name: hermes-allowed-users
  namespace_ref: ops
  keys:
  - users.json
  - allowed-users.json
  purpose: Verified platform-id to directory-slug mappings and allowlist
  recipe: Provision through the sealed-secrets workflow; never commit values
  required_when: org.modules.hermes-ops-chat.enabled
