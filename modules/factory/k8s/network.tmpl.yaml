apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factory
  namespace: "{{NS_FACTORY}}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: factory-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              "{{LABEL_PREFIX}}/kind": user-sessions
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{NS_PORTAL}}"
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{NS_MONITORING}}"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{NS_LLM}}"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{NS_MODELS}}"
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [lane-gpu-a, lane-gpu-b]
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{NS_SYSTEM}}"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pace
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: "{{APISERVER_ENDPOINT_IP}}/32"
        - ipBlock:
            cidr: "{{APISERVER_SERVICE_IP}}/32"
      ports:
        - protocol: TCP
          port: {{APISERVER_PORT}}
        - protocol: TCP
          port: 443
