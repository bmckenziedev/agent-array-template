  install.sh: |
    set -eu
    python3 -m venv /opt/devpi
    /opt/devpi/bin/pip install --no-cache-dir --disable-pip-version-check --no-input -q \
      --require-hashes --only-binary=:all: --no-deps --index-url "{{M_PKG_MIRROR_PYPI_UPSTREAM}}" -r /config/requirements.txt
    /opt/devpi/bin/pip check
    /opt/devpi/bin/devpi-server --version
  start.sh: |
    set -eu
    umask 077
    SERVERDIR=/data/server
    if [ ! -e "$SERVERDIR/.nodeinfo" ]; then
      if [ -e "$SERVERDIR" ]; then
        echo "FATAL: $SERVERDIR exists but has no .nodeinfo; inspect the PVC" >&2; exit 1
      fi
      rm -rf "$SERVERDIR.init"
      pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
      /opt/devpi/bin/devpi-init --serverdir "$SERVERDIR.init" --root-passwd "$pw" --mirror-url "{{M_PKG_MIRROR_PYPI_UPSTREAM}}"
      unset pw
      mv "$SERVERDIR.init" "$SERVERDIR"
    fi
    exec /opt/devpi/bin/devpi-server --serverdir "$SERVERDIR" \
      --host 0.0.0.0 --port 3141 \
      --restrict-modify root \
      --max-request-body-size 65536 \
      --request-timeout 30 \
      --threads 20 --connection-limit 200
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devpi-data
  namespace: "{{PROJECT_NAME}}-pkg-mirror"
  labels: { app.kubernetes.io/name: pypi, app.kubernetes.io/part-of: "{{PROJECT_NAME}}" }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "{{STORAGE_CLASS_DEFAULT}}"
  resources:
    requests: { storage: "{{M_PKG_MIRROR_STORAGE}}" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpi
  namespace: "{{PROJECT_NAME}}-pkg-mirror"
  labels: { app.kubernetes.io/name: pypi, app.kubernetes.io/part-of: "{{PROJECT_NAME}}" }
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: pypi }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pypi, app.kubernetes.io/part-of: "{{PROJECT_NAME}}" }
    spec:
      runtimeClassName: "{{RUNTIME_CLASS_VM}}"
      nodeSelector:
        "{{LABEL_PREFIX}}/role-worker": "true"
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: install
          image: docker.io/library/python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
          command: ["sh", "/config/install.sh"]
          env:
            - { name: HOME, value: /tmp }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONWARNINGS, value: "ignore:pkg_resources is deprecated" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: venv,   mountPath: /opt/devpi }
            - { name: tmp,    mountPath: /tmp }
      containers:
        - name: devpi
          image: docker.io/library/python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3
          command: ["sh", "/config/start.sh"]
          env:
            - { name: HOME, value: /tmp }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONWARNINGS, value: "ignore:pkg_resources is deprecated" }
          ports:
            - { name: http, containerPort: 3141, protocol: TCP }
          readinessProbe:
            httpGet: { path: /+api, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /+api, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "2",  memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: venv,   mountPath: /opt/devpi, readOnly: true }
            - { name: data,   mountPath: /data }
            - { name: tmp,    mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: devpi-config }
        - name: venv
          emptyDir: { sizeLimit: 256Mi }
        - name: data
          persistentVolumeClaim: { claimName: devpi-data }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pypi
  namespace: "{{PROJECT_NAME}}-pkg-mirror"
  labels: { app.kubernetes.io/name: pypi, app.kubernetes.io/part-of: "{{PROJECT_NAME}}" }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: pypi }
  ports:
    - { name: http, port: 3141, targetPort: http, protocol: TCP }
