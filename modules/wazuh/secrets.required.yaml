version: 1
secrets:
  - name: indexer-cred
    namespace: "{{PROJECT_NAME}}-wazuh"
    keys: [username, password]
    purpose: Wazuh indexer administrator
    recipe: platform/sealed-secrets/seal.sh
  - name: dashboard-cred
    namespace: "{{PROJECT_NAME}}-wazuh"
    keys: [username, password]
    purpose: Wazuh dashboard indexer service identity
    recipe: platform/sealed-secrets/seal.sh
  - name: wazuh-api-cred
    namespace: "{{PROJECT_NAME}}-wazuh"
    keys: [username, password]
    purpose: Wazuh API service identity
    recipe: platform/sealed-secrets/seal.sh
  - name: wazuh-authd-pass
    namespace: "{{PROJECT_NAME}}-wazuh"
    keys: [authd.pass]
    purpose: Node-agent enrollment
    recipe: platform/sealed-secrets/seal.sh
  - name: wazuh-cluster-key
    namespace: "{{PROJECT_NAME}}-wazuh"
    keys: [key]
    purpose: Wazuh manager cluster authentication
    recipe: platform/sealed-secrets/seal.sh
