apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-agent-entrypoint
  namespace: '{{PROJECT_NAME}}-wazuh'
  labels:
    app: wazuh-agent
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/component: security
data:
  10-container-scope.sh: "#!/bin/bash\nset -euo pipefail\nCONF=/var/ossec/etc/ossec.conf\nOPTIONS=/var/ossec/etc/local_internal_options.conf\n\
    # Keep only the image-generated connection/enrollment section. Rebuild all\n# monitoring locally,\
    \ dropping stock command collectors and command wodles.\nCLIENT=\"$(sed 's/>[[:space:]]*</>\\n</g'\
    \ \"$CONF\" | sed -n '/^[[:space:]]*<client>$/,/^[[:space:]]*<\\/client>$/p')\"\n[ \"$(printf '%s\\\
    n' \"$CLIENT\" | grep -c '<client>')\" = 1 ]\n[ \"$(printf '%s\\n' \"$CLIENT\" | grep -c '</client>')\"\
    \ = 1 ]\n# Delete duplicates first: never rely on first/last option precedence.\nsed -i '/^[[:space:]]*agent.remote_conf[[:space:]]*=/d;\
    \ /^[[:space:]]*wazuh_command.remote_commands[[:space:]]*=/d; /^[[:space:]]*logcollector.remote_commands[[:space:]]*=/d;\
    \ /^[[:space:]]*sca.remote_commands[[:space:]]*=/d' \"$OPTIONS\"\nprintf '%s\\n' agent.remote_conf=0\
    \ wazuh_command.remote_commands=0 logcollector.remote_commands=0 sca.remote_commands=0 >> \"$OPTIONS\"\
    \n{\n  printf '<ossec_config>\\n%s\\n' \"$CLIENT\"\n  cat /local-policy/node.conf\n  printf '</ossec_config>\\\
    n'\n} > \"$CONF\"\necho \"container-scope: local monitoring policy; remote configuration/commands\
    \ and active response disabled\"\n"
  node.conf: "  <syscheck>\n    <disabled>no</disabled>\n    <directories check_all=\"yes\" report_changes=\"\
    no\">/host/root/usr/bin,/host/root/usr/sbin</directories>\n  </syscheck>\n  <rootcheck><disabled>yes</disabled></rootcheck>\n\
    \  <active-response><disabled>yes</disabled></active-response>\n  <localfile><log_format>syslog</log_format><location>/host/var/log/auth.log</location></localfile>\n\
    \  <localfile><log_format>syslog</log_format><location>/host/var/log/kern.log</location></localfile>\n\
    \  <localfile><log_format>syslog</log_format><location>/host/var/log/ufw.log</location></localfile>\n\
    \  <localfile><log_format>syslog</log_format><location>/host/var/log/dpkg.log</location></localfile>\n\
    \  <sca><enabled>no</enabled></sca>\n  <wodle name=\"syscollector\"><disabled>yes</disabled></wodle>\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: '{{PROJECT_NAME}}-wazuh'
  labels:
    app: wazuh-agent
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/component: security
spec:
  selector:
    matchLabels:
      app: wazuh-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: wazuh-agent
        app.kubernetes.io/name: wazuh-agent
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      dnsPolicy: ClusterFirst
      tolerations:
      - operator: Exists
      containers:
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.14.8@sha256:7b87b6142c52320f0b6db5373e38c3f6f3024169fbedc08e64e5f9444a61520b
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -ec
        args:
        - '# Privsep_SetGroup replaces supplementary groups with wazuh''s GID.

          # Map that image-local group to host adm (4), and preserve its access

          # to image-local files. /var/ossec has no host mounts at this point.

          # No passwd/shadow, enrollment identity, or host metadata is edited.

          grep -q ''^wazuh:x:999:'' /etc/group

          sed -i ''s/^wazuh:x:999:/wazuh:x:4:/'' /etc/group

          # Exclude bundled SCA cache (disabled). Persisted identity is restored

          # later by /init; this operation touches only image-local metadata.

          chown -h --from=:999 :4 /var/ossec

          chown -hR --from=:999 :4 /var/ossec/queue /var/ossec/logs /var/ossec/var /var/ossec/etc /var/ossec/lib
          /var/ossec/ruleset /var/ossec/active-response /var/ossec/wodles

          chmod g+w /var/ossec/queue/logcollector /var/ossec/queue/fim/db

          exec /init

          '
        terminationMessagePath: /tmp/termination-log
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.{{PROJECT_NAME}}-wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: '1514'
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.{{PROJECT_NAME}}-wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: '1515'
        - name: WAZUH_REGISTRATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-authd-pass
              key: authd.pass
        - name: WAZUH_AGENT_GROUP
          value: k3s-nodes
        - name: WAZUH_AGENT_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - KILL
            - SETUID
            - SETGID
            - SYS_CHROOT
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: host-usr-bin
          mountPath: /host/root/usr/bin
          readOnly: true
        - name: host-usr-sbin
          mountPath: /host/root/usr/sbin
          readOnly: true
        - name: entrypoint
          mountPath: /entrypoint-scripts
          readOnly: true
        - name: host-log-auth
          mountPath: /host/var/log/auth.log
          readOnly: true
        - name: host-log-kern
          mountPath: /host/var/log/kern.log
          readOnly: true
        - name: host-log-ufw
          mountPath: /host/var/log/ufw.log
          readOnly: true
        - name: host-log-dpkg
          mountPath: /host/var/log/dpkg.log
          readOnly: true
        - name: local-policy
          mountPath: /local-policy
          readOnly: true
        - name: agent-state
          mountPath: /var/ossec/etc/client.keys
          subPath: client.keys
      volumes:
      - name: host-usr-bin
        hostPath:
          path: /usr/bin
          type: Directory
      - name: host-usr-sbin
        hostPath:
          path: /usr/sbin
          type: Directory
      - name: agent-state
        hostPath:
          path: /var/lib/{{PROJECT_NAME}}/wazuh-agent
          type: DirectoryOrCreate
      - name: entrypoint
        configMap:
          name: wazuh-agent-entrypoint
          defaultMode: 493
          items:
          - key: 10-container-scope.sh
            path: 10-container-scope.sh
      - name: host-log-auth
        hostPath:
          path: /var/log/auth.log
          type: File
      - name: host-log-kern
        hostPath:
          path: /var/log/kern.log
          type: File
      - name: host-log-ufw
        hostPath:
          path: /var/log/ufw.log
          type: File
      - name: host-log-dpkg
        hostPath:
          path: /var/log/dpkg.log
          type: File
      - name: local-policy
        configMap:
          name: wazuh-agent-entrypoint
          items:
          - key: node.conf
            path: node.conf
      securityContext:
        supplementalGroups:
        - 999
        - 4
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-agent-state
        image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command:
        - sh
        - -ec
        - touch /state/client.keys; chown 0:4 /state/client.keys; chmod 640 /state/client.keys
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: agent-state
          mountPath: /state
