apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-default-deny
  namespace: '{{PROJECT_NAME}}-wazuh'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-endpoint
  namespace: '{{PROJECT_NAME}}-wazuh'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: '{{APISERVER_ENDPOINT_IP}}/32'
    ports:
    - protocol: TCP
      port: {{APISERVER_PORT}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-agent-paths
  namespace: '{{PROJECT_NAME}}-wazuh'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: wazuh-agent
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: wazuh-manager
    ports:
    - protocol: TCP
      port: 1514
    - protocol: TCP
      port: 1515
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-manager-paths
  namespace: '{{PROJECT_NAME}}-wazuh'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: wazuh-agent
    ports:
    - protocol: TCP
      port: 1514
    - protocol: TCP
      port: 1515
  - from:
    - podSelector:
        matchLabels:
          app: wazuh-dashboard
    ports:
    - protocol: TCP
      port: 55000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: wazuh-indexer
    ports:
    - protocol: TCP
      port: 9200
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
