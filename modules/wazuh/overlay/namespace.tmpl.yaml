apiVersion: v1
kind: Namespace
metadata:
  name: wazuh
  labels:
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: security
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: "{{M_WAZUH_PSA_VERSION}}"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: "{{M_WAZUH_PSA_VERSION}}"
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: "{{M_WAZUH_PSA_VERSION}}"
