apiVersion: batch/v1
kind: Job
metadata:
  name: diagnostic-task
  namespace: example-session-jobs
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: task
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
