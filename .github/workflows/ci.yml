name: CI
on:
  push:
  pull_request:
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/ci/run_tests.py
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Render both module configurations
        run: |
          set -euo pipefail
          python tools/render/render.py --org org/org.example.yaml --out "$RUNNER_TEMP/rendered"
          python - <<'PY'
          import os, pathlib, yaml
          source = pathlib.Path('org/org.example.yaml')
          model = yaml.safe_load(source.read_text())
          config = model
          for name, value in config.get('modules', {}).items():
              value['enabled'] = True
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'org-all'
          target.mkdir()
          for example in source.parent.glob('*.example.yaml'):
              (target / example.name).write_text(example.read_text())
          (target / source.name).write_text(yaml.safe_dump(model, sort_keys=False))
          version = str(config['cluster']['version']).lstrip('v').split('+')[0]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('K8S_VERSION=' + version + '\n')
          PY
          python tools/render/render.py --org "$RUNNER_TEMP/org-all/org.example.yaml" --out "$RUNNER_TEMP/rendered-all"
          python tools/render/render.py --lint-placeholders .
          if [[ -f org/org.yaml ]]; then
            python tools/render/render.py --org org/org.yaml --check --out rendered
          fi
      - run: bash tools/ci/install_tools.sh
      - name: Validate manifests, admission expressions, and alerts
        run: |
          set -euo pipefail
          for tree in "$RUNNER_TEMP/rendered" "$RUNNER_TEMP/rendered-all"; do
            bash tools/ci/validate_manifests.sh "$tree" "$K8S_VERSION"
            python tools/ci/check_contracts.py --rendered "$tree"
            python tools/ci/lint_cel.py "$tree"
            bash tools/ci/promtool_tests.sh "$tree"
          done
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/sanitize/scan.py --root .
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/linkcheck.py --root .
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './rendered/*' -not -path './.git/*' -print0 |
            xargs -0 -r shellcheck
      - run: pwsh -File tools/ci/check_powershell.ps1
