version: 1
secrets:
  - name: oidc-client
    namespace_ref: portal
    keys: [client_secret]
    purpose: OIDC client secret
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref portal --name oidc-client --keys client_secret"
    required_when: always
  - name: oauth2-proxy
    namespace_ref: portal
    keys: [cookie_secret]
    purpose: Session-cookie encryption
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref portal --name oauth2-proxy --keys cookie_secret"
    required_when: always
