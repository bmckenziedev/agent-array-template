apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oauth2-proxy-grafana-ingress
  namespace: '{{NS_MONITORING}}'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kps-grafana
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: oauth2-proxy-grafana
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: '{{NS_PORTAL}}'
    ports:
    - protocol: TCP
      port: 3000
