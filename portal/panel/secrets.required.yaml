version: 1
secrets:
  - name: panel-env
    required_when: always
    namespace_ref: portal
    keys: [CF_ACCESS_AUD]
    purpose: Cloudflare Access application audience when that access variant is enabled
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref portal --name panel-env"
  - name: litellm-mint
    required_when: always
    namespace_ref: portal
    keys: [mint_key]
    purpose: Route-restricted LiteLLM mint credential for optional session-jobs dispatch
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref portal --name litellm-mint"
