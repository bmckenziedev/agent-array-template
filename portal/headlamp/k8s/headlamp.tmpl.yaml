apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: '{{NS_PORTAL}}'
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
        app.kubernetes.io/component: headlamp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: headlamp
        image: ghcr.io/headlamp-k8s/headlamp:v0.45.0@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49
        args:
        - -kubeconfig=/etc/headlamp/kubeconfig
        - -oidc-use-cookie=true
        - -kubeconfig-dir=/tmp/kubeconfigs
        env:
        - name: HEADLAMP_CONFIG_OIDC_CLIENT_ID
          value: '{{OIDC_CLIENT_ID}}'
        - name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
          value: '{{OIDC_ISSUER_URL}}'
        - name: HEADLAMP_CONFIG_OIDC_SCOPES
          value: openid,email,profile,groups
        - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oidc-client
              key: client_secret
        - name: KUBECONFIG
          value: /etc/headlamp/kubeconfig
        ports:
        - name: http
          containerPort: 4466
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: api-ca
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: cluster
          mountPath: /etc/headlamp
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: api-ca
        configMap:
          name: kube-root-ca.crt
          items:
          - key: ca.crt
            path: ca.crt
      - name: cluster
        configMap:
          name: headlamp-cluster
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: '{{NS_PORTAL}}'
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: headlamp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
  ports:
  - name: http
    port: 80
    targetPort: 4466
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-cluster
  namespace: '{{NS_PORTAL}}'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: headlamp
data:
  kubeconfig: "apiVersion: v1\nkind: Config\nclusters:\n- name: '{{PROJECT_NAME}}'\n  cluster:\n    server: '{{APISERVER_URL}}'\n    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\ncontexts:\n- name: '{{PROJECT_NAME}}'\n  context:\n    cluster: '{{PROJECT_NAME}}'\ncurrent-context: '{{PROJECT_NAME}}'\nusers: []\n"
