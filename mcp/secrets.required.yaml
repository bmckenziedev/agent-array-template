version: 1
secrets:
  - name: per-registry-entry
    required_when: always
    namespace_ref: mcp
    keys: [per-registry-entry]
    purpose: "Per registry entry: deploy server_secret.name and server_secret.key; upstream credential mounted only by its server"
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref mcp --name <server_secret.name>"
