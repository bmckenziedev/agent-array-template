apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aa-mcp-tokenreview
  labels:
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
