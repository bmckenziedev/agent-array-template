apiVersion: v1
kind: Service
metadata:
  name: "{{MCP_SERVICE_NAME}}"
  namespace: "{{NS_MCP}}"
  labels:
    app.kubernetes.io/name: "{{MCP_SERVICE_NAME}}"
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "{{MCP_SERVICE_NAME}}"
  ports:
    - {name: http, port: {{MCP_PORT}}, targetPort: http}
