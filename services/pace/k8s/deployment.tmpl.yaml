apiVersion: apps/v1
kind: Deployment
metadata:
  name: pace
  namespace: "{{NS_SYSTEM}}"
  labels:
    app.kubernetes.io/name: pace
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: pacing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pace
        app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
        app.kubernetes.io/component: pacing
    spec:
      serviceAccountName: pace
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pace
          image: "{{IMAGE_PACE}}"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: state
              mountPath: /var/lib/pace
            - name: directory
              mountPath: /etc/agent-array/org
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pace
        - name: directory
          projected:
            sources:
              - configMap:
                  name: org-directory
                  items:
                    - key: accounts.json
                      path: accounts.json
                    - key: users.json
                      path: users.json
                    - key: teams.json
                      path: teams.json
              - configMap:
                  name: pace-config
                  items:
                    - key: pace.json
                      path: pace.json
---
apiVersion: v1
kind: Service
metadata:
  name: pace
  namespace: "{{NS_SYSTEM}}"
  labels:
    app.kubernetes.io/name: pace
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: pacing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pace
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pace
  namespace: "{{NS_SYSTEM}}"
  labels:
    app.kubernetes.io/name: pace
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: pacing
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: "{{STORAGE_CLASS_DEFAULT}}"
  resources:
    requests:
      storage: "{{C_PACE_STORAGE}}"
