apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "pace-reader-{{TEAM_ID}}"
  namespace: "{{NS_SYSTEM}}"
  labels:
    app.kubernetes.io/name: pace
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: pacing
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [org-directory]
    verbs: [get]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["pace:8080"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "pace-reader-{{TEAM_ID}}"
  namespace: "{{NS_SYSTEM}}"
  labels:
    app.kubernetes.io/name: pace
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: pacing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "pace-reader-{{TEAM_ID}}"
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: "{{TEAM_OIDC_GROUP}}"
