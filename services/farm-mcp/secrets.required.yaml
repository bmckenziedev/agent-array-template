version: 1
secrets:
  - name: litellm-mint
    namespace_ref: system
    keys: [LITELLM_MINT_KEY]
    purpose: LiteLLM scoped mint credential; allowed routes key/generate, key/delete, key/info
    recipe: "platform/sealed-secrets/seal.sh --namespace-ref system --name litellm-mint"
    required_when: always
