apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: farm-mcp-session-read-scale
  namespace: "{{USER_NS}}"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: farm-mcp-session-read-scale
  namespace: "{{USER_NS}}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: farm-mcp-session-read-scale
subjects:
  - {kind: ServiceAccount, name: farm-mcp, namespace: "{{NS_SYSTEM}}"}
