apiVersion: v1
kind: ServiceAccount
metadata:
  name: farm-mcp
  namespace: "{{NS_SYSTEM}}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{PROJECT_NAME}}-farm-mcp-identity"
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{PROJECT_NAME}}-farm-mcp-identity"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{PROJECT_NAME}}-farm-mcp-identity"
subjects:
  - {kind: ServiceAccount, name: farm-mcp, namespace: "{{NS_SYSTEM}}"}
