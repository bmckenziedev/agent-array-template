# Chart 2.20.0 creates its own metrics Service unconditionally. This separately
# named Service gives the GitOps monitor a reviewed manifest inventory contract.
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-platform-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/component: platform-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: sealed-secrets
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
