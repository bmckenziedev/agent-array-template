apiVersion: batch/v1
kind: CronJob
metadata:
  name: <app-name>
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: <app-name>
    app.kubernetes.io/part-of: <project-name>
    app.kubernetes.io/component: application
spec:
  schedule: 0 2 * * *
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: <app-name>
            app.kubernetes.io/part-of: <project-name>
            app.kubernetes.io/component: application
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: app
            image: <image>@sha256:<digest>
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
                ephemeral-storage: 64Mi
              limits:
                cpu: '1'
                memory: 512Mi
                ephemeral-storage: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            command:
            - <job-command>
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
          restartPolicy: Never
