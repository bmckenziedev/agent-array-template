version: 1
# Receiver and enabled heartbeat Secrets are derived from org.alerting by render_plugin.py.
# The complete deployment inventory is rendered/files/monitoring/secrets.required.yaml.
secrets:
  - name: grafana-admin
    required_when: always
    namespace_ref: monitoring
    keys: [admin-user, admin-password]
    purpose: Grafana emergency administrator credentials
    recipe: platform/sealed-secrets/seal.sh --namespace-ref monitoring --name grafana-admin
  - name: grafana-oidc
    required_when: always
    namespace_ref: monitoring
    keys: [client-id, client-secret]
    purpose: Organization Grafana OIDC client
    recipe: platform/sealed-secrets/seal.sh --namespace-ref monitoring --name grafana-oidc
  - name: "{{C_MONITORING_LITELLM_METRICS_SECRET}}"
    required_when: always
    namespace_ref: monitoring
    keys: ["{{C_MONITORING_LITELLM_METRICS_SECRET_KEY}}"]
    purpose: LiteLLM metrics-only scrape key with no model permissions
    recipe: platform/sealed-secrets/seal.sh --namespace-ref monitoring --name litellm-metrics-key
