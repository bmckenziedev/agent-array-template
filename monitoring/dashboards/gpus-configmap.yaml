apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gpus
  namespace: "{{NS_MONITORING}}"
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: "{{PROJECT_NAME}}"
    app.kubernetes.io/component: dashboards
data:
  gpus.json: |-
    {
      "uid": "agent-array-gpus",
      "title": "agent-array / GPUs",
      "description": "DCGM per GPU: utilization, VRAM, power vs limit, temperature, clocks and throttle reasons. Empty until the GPU rigs join and gpu/03-dcgm-exporter.yaml is deployed.",
      "tags": [
        "agent-array",
        "gpu",
        "dcgm"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "refresh": "30s",
      "timezone": "",
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "weekStart": "",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "includeAll": false,
            "multi": false
          },
          {
            "name": "node",
            "type": "query",
            "datasource": "${datasource}",
            "query": "label_values(kube_node_info, node)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "links": [
        {
          "title": "agent-array dashboards",
          "type": "dashboards",
          "tags": [
            "agent-array"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "panels": [
        {
          "type": "text",
          "title": "",
          "options": {
            "mode": "markdown",
            "content": "Missing metrics represent unknown state. Confirm exporter health and module enablement before remediation.",
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            }
          },
          "id": 1,
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "id": 2,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "GPUs reporting",
          "description": "GPUs with a utilization series. Expected 2 (RTX a on $node, example-24gb on $node).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(DCGM_FI_DEV_GPU_UTIL{job=~\".*dcgm-exporter.*\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          },
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "DCGM targets up",
          "description": "dcgm-exporter scrape targets with up == 1. DCGMExporterMissing warns when an awake GPU node has none.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(up{job=~\".*dcgm-exporter.*\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          },
          "id": 4,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Average utilization",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg(DCGM_FI_DEV_GPU_UTIL{job=~\".*dcgm-exporter.*\"})",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 30
                  },
                  {
                    "color": "green",
                    "value": 60
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          },
          "id": 5,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Total power draw",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(DCGM_FI_DEV_POWER_USAGE{job=~\".*dcgm-exporter.*\"})",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          },
          "id": 6,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "Hottest GPU",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(DCGM_FI_DEV_GPU_TEMP{job=~\".*dcgm-exporter.*\"})",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 83
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          },
          "id": 7,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 4
          }
        },
        {
          "type": "stat",
          "title": "VRAM used (all GPUs)",
          "description": "vLLM pre-allocates about 90% of VRAM, so 90-95% is normal steady state.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(DCGM_FI_DEV_FB_USED{job=~\".*dcgm-exporter.*\"}) / sum(DCGM_FI_DEV_FB_USED{job=~\".*dcgm-exporter.*\"} + DCGM_FI_DEV_FB_FREE{job=~\".*dcgm-exporter.*\"})",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "red",
                    "value": 0.98
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          },
          "id": 8,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 4
          }
        },
        {
          "type": "table",
          "title": "GPUs",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu, modelName, UUID) (DCGM_FI_DEV_GPU_UTIL{job=~\".*dcgm-exporter.*\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu, modelName, UUID) (DCGM_FI_DEV_GPU_TEMP{job=~\".*dcgm-exporter.*\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu, modelName, UUID) (DCGM_FI_DEV_POWER_USAGE{job=~\".*dcgm-exporter.*\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu, modelName, UUID) ((DCGM_FI_DEV_FB_USED{job=~\".*dcgm-exporter.*\"} / (DCGM_FI_DEV_FB_USED{job=~\".*dcgm-exporter.*\"} + DCGM_FI_DEV_FB_FREE{job=~\".*dcgm-exporter.*\"})) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu, modelName, UUID) (DCGM_FI_DEV_SM_CLOCK{job=~\".*dcgm-exporter.*\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table"
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu, modelName, UUID) (DCGM_FI_DEV_XID_ERRORS{job=~\".*dcgm-exporter.*\"} * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "node": "Node",
                  "gpu": "GPU",
                  "modelName": "Model",
                  "Value #A": "Util",
                  "Value #B": "Temp",
                  "Value #C": "Power",
                  "Value #D": "VRAM used",
                  "Value #E": "SM clock",
                  "Value #F": "Last XID"
                },
                "indexByName": {
                  "node": 0,
                  "gpu": 1,
                  "modelName": 2,
                  "Value #A": 3,
                  "Value #B": 4,
                  "Value #C": 5,
                  "Value #D": 6,
                  "Value #E": 7,
                  "Value #F": 8,
                  "UUID": 9
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Util"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Power"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "watt"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "VRAM used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "SM clock"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "MHz"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": "",
              "countRows": false
            }
          },
          "id": 9,
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 8
          }
        },
        {
          "type": "row",
          "title": "Utilization",
          "collapsed": false,
          "id": 10,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "GPU utilization",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu) ((DCGM_FI_DEV_GPU_UTIL{job=~\".*dcgm-exporter.*\"}) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "{{node}} GPU{{gpu}}",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "gradientMode": "none",
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 11,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          }
        },
        {
          "type": "timeseries",
          "title": "GPU utilization, 1h rolling average",
          "description": "Factory design 'GPUs busy' query: avg_over_time(DCGM_FI_DEV_GPU_UTIL[1h]).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node, gpu) ((avg_over_time(DCGM_FI_DEV_GPU_UTIL{job=~\".*dcgm-exporter.*\"}[1h])) * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"}))",
              "legendFormat": "{{node}} GPU{{gpu}}",
              "range": true,
              "instant": false,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "gradientMode": "none",
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          }
        },
        {
