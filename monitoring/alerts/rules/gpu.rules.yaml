apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: '{{PROJECT_NAME}}-gpu'
  namespace: '{{NS_MONITORING}}'
  labels:
    app.kubernetes.io/part-of: '{{PROJECT_NAME}}'
    app.kubernetes.io/component: alerts
    release: kps
spec:
  groups:
  - name: agent-array.gpu
    rules:
    - record: aa:gpu_node:active
      expr: 'max by (node) (kube_node_labels{job="kube-state-metrics",label_{{C_MONITORING_KSM_LABEL_PREFIX}}_role_gpu="true"})

        unless on (node) max by (node) (kube_node_spec_unschedulable{job="kube-state-metrics"} == 1)

        and on (node) max by (node) (kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true"}
        == 1)'
      annotations: {}
    - alert: GPUTemperatureHigh
      expr: DCGM_FI_DEV_GPU_TEMP > 83
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: GPUTemperatureHigh
        description: Inspect the alert labels and metric history before remediation.
    - alert: GPUTemperatureHigh
      expr: DCGM_FI_DEV_GPU_TEMP > 90
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: GPUTemperatureHigh
        description: Inspect the alert labels and metric history before remediation.
    - alert: GPUMemoryNearFull
      expr: 'DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.98

        '
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: GPUMemoryNearFull
        description: Inspect the alert labels and metric history before remediation.
    - alert: GPUXidError
      expr: '(DCGM_FI_DEV_XID_ERRORS != 0 unless DCGM_FI_DEV_XID_ERRORS == 45)

        and changes(DCGM_FI_DEV_XID_ERRORS[15m]) > 0

        '
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: GPUXidError
        description: Inspect the alert labels and metric history before remediation.
    - alert: GPUXidError
      expr: 'DCGM_FI_DEV_XID_ERRORS == 48 or DCGM_FI_DEV_XID_ERRORS == 61 or DCGM_FI_DEV_XID_ERRORS == 62

        or DCGM_FI_DEV_XID_ERRORS == 74 or DCGM_FI_DEV_XID_ERRORS == 79 or DCGM_FI_DEV_XID_ERRORS == 94

        or DCGM_FI_DEV_XID_ERRORS == 95 or DCGM_FI_DEV_XID_ERRORS == 119 or DCGM_FI_DEV_XID_ERRORS == 120

        '
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: GPUXidError
        description: Inspect the alert labels and metric history before remediation.
    - alert: DCGMExporterMissing
      expr: "aa:gpu_node:active\nunless on (node)\nmax by (node) (\n  (up{job=~\".*dcgm-exporter.*\"} == 1)\n  *\
        \ on (namespace, pod) group_left (node)\n  max by (namespace, pod, node) (kube_pod_info{job=\"kube-state-metrics\"\
        })\n)\n"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: DCGMExporterMissing
        description: Inspect the alert labels and metric history before remediation.
    - alert: GPUNodeNoAllocatableGPU
      expr: 'aa:gpu_node:active

        unless on (node)

        (max by (node) (kube_node_status_allocatable{job="kube-state-metrics", resource="nvidia_com_gpu"}) > 0)

        '
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: GPUNodeNoAllocatableGPU
        description: Inspect the alert labels and metric history before remediation.
