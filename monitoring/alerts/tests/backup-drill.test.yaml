rule_files:
- ../rules/backup-drill.rules.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: aa_backup_restore_drill_last_run_timestamp_seconds{job="node-exporter",host="node-a"}
    values: '0x200'
  - series: aa_backup_restore_drill_last_success_timestamp_seconds{job="node-exporter",host="node-a"}
    values: '0x200'
  - series: aa_backup_restore_drill_last_exit_code{job="node-exporter",host="node-a"}
    values: '0x200'
  - series: aa_backup_last_sealed_keys{job="node-exporter",host="node-a"}
    values: 2x200
  - series: kube_secret_created{job="kube-state-metrics",namespace="agent-array-system",secret="sealed-secrets-keyaaaaa"}
    values: '0x200'
  - series: kube_secret_created{job="kube-state-metrics",namespace="agent-array-system",secret="sealed-secrets-keybbbbb"}
    values: '0x200'
  - series: kube_secret_created{job="kube-state-metrics",namespace="agent-array-system",secret="sealed-secrets-controller-token"}
    values: '0x200'
  - series: aa_backup_enabled
    values: 1x3000
  alert_rule_test:
  - alertname: AgentArrayRestoreDrillFailed
    eval_time: 3h
  - alertname: AgentArrayRestoreDrillOverdue
    eval_time: 3h
  - alertname: AgentArrayRestoreDrillMetricsMissing
    eval_time: 3h
  - alertname: AgentArrayBackupMissingSealedKey
    eval_time: 3h
- interval: 1m
  input_series:
  - series: aa_backup_restore_drill_last_exit_code{job="node-exporter",host="node-a"}
    values: 0x9 1x40
  - series: aa_backup_restore_drill_last_run_timestamp_seconds{job="node-exporter",host="node-a"}
    values: '0x50'
  - series: aa_backup_enabled
    values: 1x3000
  alert_rule_test:
  - alertname: AgentArrayRestoreDrillFailed
    eval_time: 15m
  - alertname: AgentArrayRestoreDrillFailed
    eval_time: 25m
    exp_alerts:
    - exp_labels:
        severity: warning
        job: node-exporter
        host: node-a
      exp_annotations:
        summary: AgentArrayRestoreDrillFailed
        description: Inspect the alert labels and metric history before remediation.
- interval: 1m
  input_series:
  - series: aa_backup_restore_drill_last_success_timestamp_seconds{job="node-exporter",host="node-a"}
    values: -3103200x150
  - series: aa_backup_enabled
    values: 1x3000
  alert_rule_test:
  - alertname: AgentArrayRestoreDrillOverdue
    eval_time: 30m
  - alertname: AgentArrayRestoreDrillOverdue
    eval_time: 2h
    exp_alerts:
    - exp_labels:
        severity: warning
        job: node-exporter
        host: node-a
      exp_annotations:
        summary: AgentArrayRestoreDrillOverdue
        description: Inspect the alert labels and metric history before remediation.
- interval: 1m
  input_series:
  - series: aa_backup_last_sealed_keys{job="node-exporter",host="node-a"}
    values: 1x500
  - series: aa_backup_enabled
    values: 1x3000
  alert_rule_test:
  - alertname: AgentArrayRestoreDrillMetricsMissing
    eval_time: 5h
  - alertname: AgentArrayRestoreDrillMetricsMissing
    eval_time: 7h
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: AgentArrayRestoreDrillMetricsMissing
        description: Inspect the alert labels and metric history before remediation.
- interval: 1m
  input_series:
  - series: aa_backup_last_sealed_keys{job="node-exporter",host="node-a"}
    values: 1x1700
  - series: kube_secret_created{job="kube-state-metrics",namespace="agent-array-system",secret="sealed-secrets-keyaaaaa"}
    values: '0x1700'
  - series: kube_secret_created{job="kube-state-metrics",namespace="agent-array-system",secret="sealed-secrets-keybbbbb"}
    values: '0x1700'
  - series: aa_backup_enabled
    values: 1x3000
  alert_rule_test:
  - alertname: AgentArrayBackupMissingSealedKey
    eval_time: 25h
  - alertname: AgentArrayBackupMissingSealedKey
    eval_time: 27h
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: agent-array-system
      exp_annotations:
        summary: AgentArrayBackupMissingSealedKey
        description: Inspect the alert labels and metric history before remediation.
