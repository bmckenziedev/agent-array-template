rule_files:
- ../rules/factory.rules.yaml
evaluation_interval: 1m
tests:
- name: missing telemetry never means idle or suspended
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 20m
    alertname: FactoryIdleWithReadyBacklog
    exp_alerts: []
  - eval_time: 20m
    alertname: FactoryWaitingOnSuspendedNode
    exp_alerts: []
  - eval_time: 20m
    alertname: FactoryParseApplyFailureRateHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: KataNodeSwapEnabled
    exp_alerts: []
- name: ready backlog idle on healthy awake model
  interval: 1m
  input_series:
  - series: aa_factory_snapshot_timestamp_seconds{lane="gpu-a-a",node="gpu-a"}
    values: 0+60x90
  - series: aa_factory_ready{lane="gpu-a-a",node="gpu-a"}
    values: 2+0x90
  - series: aa_factory_inflight{lane="gpu-a-a",node="gpu-a"}
    values: 0+0x90
  - series: aa_factory_gpu_seconds_total{lane="gpu-a-a",node="gpu-a"}
    values: 0+0x90
  - series: aa_factory_node_suspended{lane="gpu-a-a",node="gpu-a"}
    values: 0+0x90
  - series: aa:gpu_node:active{node="gpu-a"}
    values: 1+0x90
  - series: up{namespace="agent-array-models",job="lane-gpu-a",pod="model1"}
    values: 1+0x90
  - series: kube_pod_info{job="kube-state-metrics",namespace="agent-array-models",pod="model1",node="gpu-a"}
    values: 1+0x90
  - series: aa_factory_attempts_total{lane="gpu-a-a",node="gpu-a",kind="doc_map",outcome="pass"}
    values: 0+0x90
  - series: aa_factory_attempts_total{lane="gpu-a-a",node="gpu-a",kind="doc_map",outcome="fail_parse"}
    values: 0+0x90
  - series: aa_factory_attempts_total{lane="gpu-a-a",node="gpu-a",kind="doc_map",outcome="fail_apply"}
    values: 0+0x90
  alert_rule_test:
  - eval_time: 20m
    alertname: FactoryIdleWithReadyBacklog
    exp_alerts:
    - exp_labels:
        lane: gpu-a-a
        node: gpu-a
        severity: warning
      exp_annotations:
        summary: FactoryIdleWithReadyBacklog
        description: Inspect the alert labels and metric history before remediation.
  - eval_time: 20m
    alertname: FactoryWaitingOnSuspendedNode
    exp_alerts: []
  - eval_time: 20m
    alertname: FactoryParseApplyFailureRateHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: KataNodeSwapEnabled
    exp_alerts: []
